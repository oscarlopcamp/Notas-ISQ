<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pruebas de interacción</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 1rem; }
    iframe { width: 1200px; height: 800px; border: 1px solid #999; }
    .fail { color: #a8322d; } .pass { color: #1d7a4d; }
  </style>
</head>
<body data-status="running">
  <h1>Pruebas de interacción</h1>
  <p>Usa la aplicación real dentro de un marco. Atención: reinicia el progreso guardado en este navegador.</p>
  <ul id="out"></ul>
  <iframe id="frame" title="Aplicación"></iframe>
  <script type="module">
    const frame = document.getElementById('frame');
    const out = document.getElementById('out');
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    let failed = 0;
    const check = (name, ok, detail = '') => {
      if (!ok) failed += 1;
      out.insertAdjacentHTML('beforeend', `<li class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${name}${detail ? ` — ${detail}` : ''}</li>`);
    };
    // Espera activa a que aparezca el contenido (más robusto que una pausa fija).
    const until = async (fn, timeout = 15000) => {
      const start = Date.now();
      while (Date.now() - start < timeout) {
        try { if (fn()) return true; } catch { /* aún no disponible */ }
        await wait(100);
      }
      return false;
    };
    const go = async (hash, ready) => { frame.contentWindow.location.hash = hash; await wait(300); await until(ready); };

    try { localStorage.removeItem('isq.v1'); } catch {}
    frame.src = '../index.html#/leccion/representacion-informacion';
    await new Promise((r) => { frame.onload = r; });
    const doc = () => frame.contentDocument;
    await until(() => doc().querySelectorAll('.widget .t2b-stream').length && doc().querySelector('.lesson-header .btn'));
    const state = () => JSON.parse(frame.contentWindow.localStorage.getItem('isq.v1') || '{}');

    // Progreso
    const completeBtn = [...doc().querySelectorAll('.lesson-header .btn')].find((b) => b.textContent.includes('completada'));
    completeBtn.click();
    await wait(200);
    check('marcar lección como completada se guarda', Boolean(state().completed?.['representacion-informacion']));
    check('el índice lateral refleja la lección completada', Boolean(doc().querySelector('.nav-lesson.done')));
    const favBtn = [...doc().querySelectorAll('.lesson-header .btn')].find((b) => b.textContent.includes('favoritos'));
    favBtn.click();
    await wait(100);
    check('añadir a favoritos se guarda', state().favorites?.includes('representacion-informacion'));

    // Niveles
    doc().querySelector('.level-tab[data-level="matematico"]').click();
    await wait(200);
    const visible = [...doc().querySelectorAll('.level-block')].filter((b) => !b.hidden).map((b) => b.dataset.level);
    check('seleccionar el nivel 2 oculta los otros niveles', JSON.stringify(visible) === '["matematico"]', visible.join(','));
    check('el nivel elegido se recuerda', state().level === 'matematico');
    doc().querySelector('.level-tab[data-level="todo"]').click();
    await wait(200);
    check('«Ruta completa» muestra los tres niveles', [...doc().querySelectorAll('.level-block')].every((b) => !b.hidden));

    // Conversor
    const widget = [...doc().querySelectorAll('.widget')].find((w) => w.textContent.includes('Conversor texto'));
    const input = widget.querySelector('input[type="text"]');
    input.value = 'Año';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    await wait(100);
    check('en ASCII, «ñ» se marca como no representable', widget.querySelector('.widget-warning:not([hidden])')?.textContent.includes('ñ'));
    [...widget.querySelectorAll('.chip')].find((c) => c.textContent.startsWith('UTF-8')).click();
    await wait(100);
    const stream = widget.querySelector('.t2b-stream').textContent;
    check('en UTF-8, «Año» produce 41 C3 B1 6F', stream === '01000001110000111011000101101111', stream);
    check('el resumen indica 3 caracteres y 4 bytes', widget.querySelector('.widget-stats').textContent.startsWith('3 caracteres · 4 bytes'));

    // Búsqueda
    const search = doc().getElementById('global-search');
    search.value = 'utf8';
    search.dispatchEvent(new Event('input'));
    await wait(100);
    search.value = 'codificacion';
    search.dispatchEvent(new Event('input'));
    await wait(100);
    check('la búsqueda ignora tildes («codificacion» encuentra resultados)', doc().querySelectorAll('.search-result').length > 1);
    search.value = 'histograma';
    search.dispatchEvent(new Event('input'));
    await wait(100);
    check('la búsqueda encuentra lecciones pendientes («histograma»)', [...doc().querySelectorAll('.search-result')].some((r) => r.textContent.includes('pendiente')));
    search.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));

    // Páginas que dependen del progreso
    await go('#/progreso', () => doc().querySelector('.stat b'));
    check('«Mi progreso» cuenta 1 lección completada', doc().querySelector('.stat b')?.textContent === '1');
    check('«Mi progreso» lista el favorito', doc().querySelector('.page').textContent.includes('¿Cómo representa información'));
    await go('#/leccion/circuitos-cuanticos', () => doc().querySelector('.pending-note'));
    check('una lección pendiente lo indica y no muestra contenido provisional', Boolean(doc().querySelector('.pending-note')));
    await go('#/referencias/rfc3629', () => doc().getElementById('ref-rfc3629')?.textContent.includes('Citada en'));
    check('las referencias muestran en qué lección se citan', doc().getElementById('ref-rfc3629')?.textContent.includes('Citada en'));

    // ---------- Lección 1.2: simuladores ----------
    await go('#/leccion/sistema-binario', () => doc().querySelectorAll('.widget .wheel-svg').length >= 3 && doc().querySelector('.fe-strip .fe-bit'));
    const widgetsByTitle = (t) => [...doc().querySelectorAll('.widget')].filter((w) => w.querySelector('.widget-head h4')?.textContent.includes(t));
    const btn = (root, label) => [...root.querySelectorAll('button')].find((b) => b.textContent.trim() === label);

    // Rueda sin signo (empieza en 13): tres pasos de +1 llevan a 0000 con desbordamiento
    const wheel = widgetsByTitle('rueda')[0];
    for (let i = 0; i < 3; i += 1) btn(wheel, '+1').click();
    check('rueda: 13 + 3 vuelve a 0000', wheel.querySelector('.wheel-center-pattern').textContent === '0000');
    check('rueda: el paso 15 → 0 se señala como desbordamiento', wheel.querySelector('.wheel-status').classList.contains('overflow'));
    // Rueda en signo y magnitud (empieza en 1001 = −1): +1 da −2
    const smWheel = widgetsByTitle('rueda')[1];
    btn(smWheel, '+1').click();
    check('rueda signo y magnitud: −1 «+1» da −2 y se marca el fallo', smWheel.querySelector('.wheel-center-value').textContent === '−2' || smWheel.querySelector('.wheel-center-value').textContent === '-2');
    check('rueda signo y magnitud: mensaje de suma incorrecta', smWheel.querySelector('.wheel-status').classList.contains('bad'));

    // Sumador 6 + 7 paso a paso
    const adder = widgetsByTitle('Sumador')[0];
    for (let i = 0; i < 4; i += 1) btn(adder, 'Siguiente columna →').click();
    const sum = [...adder.querySelectorAll('.adder-result .adder-sum')].map((c) => c.textContent).join('');
    check('sumador: 6 + 7 columna a columna da 1101', sum === '1101', sum);
    check('sumador: veredicto correcto sin desbordamiento', adder.querySelector('.adder-verdict').classList.contains('ok'));
    // Sumador 127 + 1 con signo
    const adder8 = widgetsByTitle('Sumador')[1];
    btn(adder8, 'Resolver todo').click();
    check('sumador: 127 + 1 con signo detecta desbordamiento', adder8.querySelector('.adder-verdict').textContent.includes('Desbordamiento con signo'));

    // Complemento a dos: −128
    const tc = widgetsByTitle('complemento a dos')[0];
    btn(tc, '-128').click();
    check('complemento a dos: −128 se marca como caso especial', Boolean(tc.querySelector('.tc-warn')));

    // Fracciones: 0.1 es periódica
    const fr = widgetsByTitle('Fracciones')[0];
    check('fracciones: 0,1 muestra expansión periódica', fr.querySelector('.tc-warn')?.textContent.includes('periódica') && fr.querySelectorAll('tr.period').length === 4);

    // Explorador IEEE 754: cambiar el bit de signo de 0.1
    const fe = widgetsByTitle('IEEE')[0];
    fe.querySelector('.fe-group.sign .fe-bit').click();
    await wait(50);
    check('IEEE 754: cambiar el bit de signo da −0.1 (0xBDCCCCCD)', fe.querySelector('input').value === '-0.1' && fe.textContent.includes('0xBDCCCCCD'));
    btn(fe, 'binary64').click();
    btn(fe, '0.1').click();
    check('IEEE 754: valor exacto de 0.1 en binary64', fe.querySelector('.fe-exact').textContent === '0.1000000000000000055511151231257827021181583404541015625');

    // ---------- Editor de código ----------
    await go('#/leccion/representacion-informacion', () => doc().querySelector('.ce textarea'));
    const ed = doc().querySelector('.ce');
    const ta = ed.querySelector('textarea');
    const original = ta.value;
    ta.value = 'print(2 + 2)';
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    check('editor: al editar aparece «modificado» y se activa «Restablecer»', !ed.querySelector('.ce-badge').hidden && !btn(ed, 'Restablecer').disabled);
    check('editor: el resaltado sigue al texto editado', ed.querySelector('.ce-highlight').textContent.trim() === 'print(2 + 2)');
    check('editor: el cambio se guarda en el navegador', Object.keys(frame.contentWindow.localStorage).some((k) => k.startsWith('isq.code.representacion-informacion') && frame.contentWindow.localStorage.getItem(k) === 'print(2 + 2)'));
    await go('#/glosario', () => doc().querySelector('.glossary-entry'));
    await go('#/leccion/representacion-informacion', () => doc().querySelector('.ce textarea'));
    const ed2 = doc().querySelector('.ce');
    check('editor: la edición se conserva al volver a la lección', ed2.querySelector('textarea').value === 'print(2 + 2)');
    btn(ed2, 'Restablecer').click();
    check('editor: «Restablecer» recupera el código original', ed2.querySelector('textarea').value === original && ed2.querySelector('.ce-badge').hidden);
    check('editor: tras restablecer no queda nada guardado', !Object.keys(frame.contentWindow.localStorage).some((k) => k.startsWith('isq.code.representacion-informacion')));
    check('editor: los bloques de Python tienen botón «Ejecutar»', Boolean(btn(ed2, '▶ Ejecutar')));
    const metrics = (el) => { const c = frame.contentWindow.getComputedStyle(el); return [c.fontFamily, c.fontSize, c.lineHeight, c.paddingTop, c.paddingLeft, c.tabSize, c.whiteSpace].join('|'); };
    const pairs = [...doc().querySelectorAll('.ce')].map((e) => [metrics(e.querySelector('.ce-highlight')), metrics(e.querySelector('textarea'))]);
    check('editor: texto editable y resaltado comparten tipografía y márgenes (alineados)', pairs.length > 0 && pairs.every(([a, b]) => a === b), pairs.find(([a, b]) => a !== b)?.join(' ≠ ') || `${pairs.length} editores`);
    await wait(200); // el tamaño se ajusta en el siguiente fotograma
    const sizes = [...doc().querySelectorAll('.ce')].map((e) => [e.querySelector('textarea').offsetHeight, e.querySelector('.ce-highlight').scrollHeight]);
    check('editor: el área editable mide lo mismo que el código', sizes.every(([t, p]) => Math.abs(t - p) <= 2), JSON.stringify(sizes));
    await go('#/leccion/sistema-binario', () => doc().querySelector('.exercise .ce'));
    check('editor: las soluciones de los ejercicios también son editables', Boolean(doc().querySelector('.exercise .ce textarea')));

    // ---------- Módulo 2 ----------
    await go('#/leccion/que-es-computacion-cuantica', () => doc().querySelector('.mz-svg') && doc().querySelector('.mz-stats'));
    const mz = widgetsByTitle('Mach')[0];
    btn(mz, 'Predicción cuántica').click();
    btn(mz, 'Enviar 1000').click();
    const counts = [...mz.querySelectorAll('.mz-row .mono:not(.muted)')].map((x) => x.textContent);
    check('interferómetro: sin desfase, 1000 fotones a D0 y 0 a D1', counts[0] === '1000' && counts[1] === '0', counts.join(','));
    mz.querySelectorAll('input[type="checkbox"]')[0].click();
    btn(mz, 'Enviar 1000').click();
    const blockedD1 = Number(mz.querySelectorAll('.mz-row .mono:not(.muted)')[1].textContent);
    check('interferómetro: al bloquear un camino aparecen fotones en D1', blockedD1 > 150 && blockedD1 < 350, String(blockedD1));
    await go('#/leccion/historia-computacion-cuantica', () => doc().querySelector('.tl-list') && doc().querySelector('.dg-box'));
    const dg = widgetsByTitle('Deutsch')[0];
    btn(dg, 'Consultar f(0)').click();
    check('Deutsch: con una consulta quedan dos funciones de tipos distintos', /constante/.test(dg.textContent) && /balanceada\)/.test(dg.querySelector('.dg-box p').textContent));
    const tl = widgetsByTitle('Línea de tiempo')[0];
    tl.querySelector('.tl-head').click();
    check('línea de tiempo: un hito se abre con su fuente', Boolean(tl.querySelector('.tl-body a.cite')));
    const total = tl.querySelectorAll('.tl-item').length;
    [...tl.querySelectorAll('.chip')].find((c) => c.textContent === 'Algoritmos').click();
    check('línea de tiempo: el filtro reduce los hitos', tl.querySelectorAll('.tl-item').length < total && tl.querySelectorAll('.tl-item').length > 0);

    // 2.5: flujo y bucle híbridos
    await go('#/leccion/qpu-computacion-hibrida', () => doc().querySelector('.hf-card') && doc().querySelector('.hl-result'));
    const hf = widgetsByTitle('viaje')[0];
    for (let i = 0; i < 6; i += 1) btn(hf, 'Siguiente →').click();
    check('flujo híbrido: el último paso vuelve a tu computadora', hf.querySelector('.hf-part.active')?.textContent.startsWith('Tu computadora') && btn(hf, 'Siguiente →').disabled);
    const hl = widgetsByTitle('Bucle híbrido')[0];
    check('bucle híbrido: el optimizador espera a la primera medida', btn(hl, 'Que decida el optimizador').disabled);
    btn(hl, 'Enviar a la QPU').click();
    for (let i = 0; i < 5; i += 1) btn(hl, 'Que decida el optimizador').click();
    const shotBars = [...hl.querySelectorAll('.hl-bar b')].map((b) => Number(b.textContent));
    check('bucle híbrido: los recuentos suman las 100 repeticiones', shotBars[0] + shotBars[1] === 100, shotBars.join(' + '));
    const finalTheta = parseFloat(hl.querySelector('output').textContent);
    check('bucle híbrido: el optimizador acerca la perilla al ajuste ideal (≈ 1,98)', Math.abs(finalTheta - 1.98) < 0.4, String(finalTheta));
    check('bucle híbrido: el historial registra seis trabajos', hl.querySelectorAll('.hl-log li').length === 6);

    // 2.6: tecnologías, métricas y titulares
    await go('#/leccion/panorama-tecnologico', () => doc().querySelector('.qm-row') && doc().querySelector('.te-card') && doc().querySelector('.hc-options'));
    const te = widgetsByTitle('Tecnologías')[0];
    btn(te, 'Iones atrapados').click();
    check('tecnologías: la ficha de iones menciona qubits idénticos', te.querySelector('.te-card').textContent.includes('idénticos'));
    const qm = widgetsByTitle('¿Más qubits')[0];
    [...qm.querySelectorAll('.chip')].find((c) => c.textContent.startsWith('Mediano')).click();
    const qmVals = [...qm.querySelectorAll('.qm-val')].map((v) => v.textContent);
    check('métricas: con 50 × 50, C no cabe y B gana a A', qmVals[2] === 'no cabe' && qm.querySelector('.widget-stats').textContent.startsWith('Procesador B gana'), qmVals.join(' | '));
    const hc = widgetsByTitle('anuncios')[0];
    hc.querySelector('.hc-options').children[1].click();
    check('titulares: la respuesta correcta se marca y cita su fuente', Boolean(hc.querySelector('.sc-item.ok .sc-why a.cite')));

    // ---------- Módulo 3, unidad 3.1 ----------
    await go('#/leccion/el-qubit', () => doc().querySelector('.ql-card.quantum'));
    const ql = widgetsByTitle('bit frente a qubit')[0];
    btn(ql, 'Guardar 1').click();
    for (let i = 0; i < 3; i += 1) btn(ql, 'Leer').click();
    check('laboratorio: leer un bit tres veces da siempre lo mismo', ql.querySelector('.ql-log').textContent.includes('1 1 1'));
    btn(ql, 'Medir').click();
    const first = ql.querySelector('.ql-status').textContent.match(/Resultado: (\d)/)?.[1];
    for (let i = 0; i < 5; i += 1) btn(ql, 'Medir otra vez').click();
    const again = ql.querySelector('.ql-status').textContent.match(/Resultado: (\d)/)?.[1];
    check('laboratorio: volver a medir un qubit repite el resultado', first !== undefined && first === again, `${first} / ${again}`);
    btn(ql, 'Preparar y medir 100').click();
    const qlCounts = [...ql.querySelectorAll('.ql-bar b')].map((b) => Number(b.textContent));
    check('laboratorio: el histograma cuenta 101 qubits preparados (una medición cada uno)', qlCounts[0] + qlCounts[1] === 101, qlCounts.join(' + '));
    [...ql.querySelectorAll('.chip')].find((c) => c.textContent === 'Siempre 0').click();
    btn(ql, 'Preparar y medir 100').click();
    check('laboratorio: «Siempre 0» da 100 ceros', ql.querySelector('.ql-bar b').textContent === '100');

    await go('#/leccion/notacion-dirac', () => doc().querySelector('.km-item'));
    const km = widgetsByTitle('ket con su vector')[0];
    const kmLeft = () => [...km.querySelectorAll('.km-col')[0].children], kmRight = () => [...km.querySelectorAll('.km-col')[1].children];
    kmLeft()[0].click();
    kmRight().find((b) => b.textContent === '[0, 1]').click();
    check('kets: una pareja incorrecta se marca', Boolean(km.querySelector('.km-item.bad')));
    const answers = ['[1, 0]', '[0, 1]', '[0.6, 0.8]', '[0.8, −0.6]', '[0.707, 0.707]', '[0.707, −0.707]'];
    answers.forEach((v, k) => { kmLeft()[k].click(); kmRight().find((b) => b.textContent === v).click(); });
    check('kets: las seis parejas correctas completan el juego', km.querySelectorAll('.km-item.ok').length === 12 && km.querySelector('.widget-stats').textContent.startsWith('¡Completado'));

    await go('#/leccion/estado-general-amplitudes', () => doc().querySelector('.ab-sum'));
    const ab = widgetsByTitle('Constructor de amplitudes')[0];
    const setRange = (input, v) => { input.value = String(v); input.dispatchEvent(new Event('input', { bubbles: true })); };
    const [aIn, bIn] = ab.querySelectorAll('input[type="range"]');
    setRange(aIn, 1); setRange(bIn, 1);
    check('amplitudes: [1, 1] no es un estado válido', ab.querySelector('.ab-sum').classList.contains('bad'));
    btn(ab, 'Normalizar').click();
    check('amplitudes: normalizar [1, 1] da 0.71 y 0.71, válido', ab.querySelector('.ab-sum').classList.contains('ok') && ab.querySelector('.ab-ket').textContent.includes('0.71|0⟩ + 0.71|1⟩'), ab.querySelector('.ab-ket').textContent);
    btn(ab, 'Cambiar el signo de b').click();
    check('amplitudes: el reto «mitad y mitad con b negativa» se supera', ab.querySelectorAll('.ab-challenges li.ok').length === 1 && ab.querySelector('.ab-challenges li.ok').textContent.includes('negativa'));

    await go('#/leccion/esfera-de-bloch', () => doc().querySelector('.bs-svg .bs-state'));
    const bs = widgetsByTitle('Esfera de Bloch')[0];
    [...bs.querySelectorAll('.chip')].find((c) => c.textContent === '|+⟩').click();
    const bsVals = () => [...bs.querySelectorAll('.ql-bar b')].map((b) => b.textContent);
    check('Bloch: |+⟩ da 50 % y 50 %', bsVals().join('|') === '50 %|50 %', bsVals().join('|'));
    const [tIn, fIn] = bs.querySelectorAll('input[type="range"]');
    setRange(fIn, 90);
    check('Bloch: girar φ no cambia las probabilidades y supera el reto del ecuador', bsVals().join('|') === '50 %|50 %' && [...bs.querySelectorAll('.ab-challenges li.ok')].some((li) => li.textContent.includes('ni |−⟩')));
    setRange(tIn, 120);
    check('Bloch: θ = 120° da P(1) = 75 %', bsVals()[1] === '75 %', bsVals().join('|'));

    // ---------- Módulo 3, unidad 3.2 ----------
    await go('#/leccion/superposicion', () => doc().querySelector('.sv-grid .btn'));
    const sv = widgetsByTitle('Superposición frente a moneda')[0];
    const svCards = sv.querySelectorAll('.sv-grid .ql-card');
    const svSend = (card, k) => [...card.querySelectorAll('.btn')].filter((b) => b.textContent === 'Enviar 100')[k].click();
    svSend(svCards[0], 1); svSend(sv.querySelectorAll('.sv-grid .ql-card')[1], 1);
    const svMixed = (k) => [...sv.querySelectorAll('.sv-grid .ql-card')[k].querySelectorAll('.sv-mode')[1].querySelectorAll('.ql-bar b')].map((b) => Number(b.textContent));
    check('superposición: tras mezclar, |+⟩ da 100 ceros', svMixed(0)[0] === 100, svMixed(0).join('/'));
    check('superposición: tras mezclar, la moneda da unos y ceros', svMixed(1)[0] > 20 && svMixed(1)[1] > 20, svMixed(1).join('/'));

    await go('#/leccion/fase-relativa', () => doc().querySelector('.pd-results .ql-bar'));
    const pd = widgetsByTitle('dial de la fase')[0];
    const pdVals = () => [...pd.querySelectorAll('.pd-results .ql-bar b')].map((b) => b.textContent);
    setRange(pd.querySelector('input[type="range"]'), 180);
    check('fase: con 180°, directa 50 % y tras mezclar siempre 1', pdVals().join('|') === '50 %|50 %|0 %|100 %', pdVals().join('|'));
    pd.querySelector('input[type="checkbox"]').click();
    check('fase: la fase global no cambia las probabilidades', pdVals().join('|') === '50 %|50 %|0 %|100 %' && pd.querySelector('.pd-state').textContent.startsWith('−'));

    await go('#/leccion/entrelazamiento', () => doc().querySelector('.el-summary table'));
    const el = widgetsByTitle('Entrelazamiento frente a correlación clásica')[0];
    const elChip = (t) => [...el.querySelectorAll('.chip')].find((c) => c.textContent.startsWith(t)).click();
    const elRun = (s, m) => { elChip(s); elChip(m); btn(el, 'Medir 100 pares').click(); };
    elRun('Par entrelazado', 'Medir directamente'); elRun('Par entrelazado', 'Mezclar'); elRun('Par clásico', 'Medir directamente'); elRun('Par clásico', 'Mezclar');
    const elCells = [...el.querySelectorAll('.el-table td.mono')].map((c) => parseInt(c.textContent, 10));
    check('entrelazamiento: el par entrelazado coincide siempre, también tras mezclar', elCells[0] === 100 && elCells[1] === 100, elCells.join(','));
    check('entrelazamiento: el par clásico deja de coincidir siempre tras mezclar', elCells[2] === 100 && elCells[3] > 25 && elCells[3] < 75, elCells.join(','));

    await go('#/leccion/interferencia', () => doc().querySelector('.ib-strip .ib-col'));
    const ib = widgetsByTitle('Constructor de interferencias')[0];
    const ibOp = (k) => [...ib.querySelectorAll('.btn')].find((b) => b.textContent.startsWith(`${k} ·`)).click();
    ibOp('M'); ibOp('M');
    check('interferencia: M, M vuelve a 0 y explica la cancelación', ib.querySelectorAll('.ab-bars .ql-bar b')[0].textContent === '100 %' && ib.querySelector('.ib-explain').textContent.includes('destructiva'));
    btn(ib, 'Vaciar').click(); ibOp('M'); ibOp('S'); ibOp('M');
    check('interferencia: M, S, M da 1 con certeza y supera el primer reto', ib.querySelectorAll('.ab-bars .ql-bar b')[1].textContent === '100 %' && ib.querySelector('.ab-challenges li').classList.contains('ok'));
    check('interferencia: cuatro columnas (inicio y tres pasos)', ib.querySelectorAll('.ib-col').length === 4);

    // ---------- Módulo 3, unidad 3.3 ----------
    await go('#/leccion/varios-qubits', () => doc().querySelector('.qr-table .qr-row'));
    const qr = widgetsByTitle('Registro de n qubits')[0];
    const qrN = (k) => [...qr.querySelectorAll('.widget-controls .chip')].find((c) => c.textContent === String(k)).click();
    const qrPrep = (q, p) => [...qr.querySelectorAll('.qr-qubit')].find((d) => d.textContent.startsWith(`qubit ${q}`)).querySelectorAll('.chip')[['|0⟩', '|1⟩', '|+⟩', '|−⟩'].indexOf(p)].click();
    qrN(3);
    check('registro: 3 qubits muestran 8 estados base', qr.querySelectorAll('.qr-row:not(.head)').length === 8);
    qrPrep(1, '|1⟩'); qrPrep(2, '|1⟩');
    const qrNonZero = () => [...qr.querySelectorAll('.qr-row:not(.head):not(.zero)')].map((r) => r.firstChild.textContent);
    check('registro: qubits 1 y 2 en |1⟩ dan solo |110⟩ (el 6) y superan el reto', qrNonZero().join() === '|110⟩' && qr.querySelector('.ab-challenges li').classList.contains('ok'), qrNonZero().join());
    btn(qr, 'Medir 100 veces').click();
    check('registro: 100 mediciones dan siempre 110', [...qr.querySelectorAll('.qr-row:not(.head)')].find((r) => r.firstChild.textContent === '|110⟩').lastChild.textContent === '100');
    qr.querySelector('input[type="checkbox"]').click();
    check('registro: GHZ de 3 qubits solo tiene |000⟩ y |111⟩', qrNonZero().join() === '|000⟩,|111⟩', qrNonZero().join());

    try { frame.contentWindow.localStorage.removeItem('isq.v1'); } catch {}
    document.body.dataset.status = failed ? 'fail' : 'pass';
  </script>
</body>
</html>
