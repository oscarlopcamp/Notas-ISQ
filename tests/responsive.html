<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Comprobación responsive</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 1rem; }
    iframe { width: 360px; height: 640px; border: 1px solid #999; }
    .fail { color: #a8322d; } .pass { color: #1d7a4d; }
  </style>
</head>
<body data-status="running">
  <h1>Desbordamiento horizontal a 360 px</h1>
  <p>Carga cada ruta en un marco de 360 px de ancho y comprueba que ningún elemento obliga a desplazar la página horizontalmente.</p>
  <ul id="out"></ul>
  <iframe id="frame" title="Vista móvil"></iframe>
  <script type="module">
    const routes = ['#/', '#/leccion/representacion-informacion', '#/leccion/sistema-binario', '#/leccion/que-es-computacion-cuantica', '#/leccion/motivaciones-simulacion', '#/leccion/ventajas-y-limitaciones', '#/leccion/el-qubit', '#/leccion/notacion-dirac', '#/leccion/estado-general-amplitudes', '#/leccion/esfera-de-bloch', '#/leccion/superposicion', '#/leccion/fase-relativa', '#/leccion/entrelazamiento', '#/leccion/interferencia', '#/simulador/interference-builder', '#/simulador/bloch-sphere', '#/leccion/qpu-computacion-hibrida', '#/leccion/panorama-tecnologico', '#/leccion/historia-computacion-cuantica', '#/leccion/von-neumann', '#/leccion/circuitos-logicos', '#/simulador/mini-cpu', '#/simulador/cache-sim', '#/simulador/float-explorer', '#/simulador/binary-adder', '#/modulo/m01', '#/biblioteca', '#/glosario', '#/referencias', '#/progreso', '#/simuladores', '#/simulador/text-to-binary', '#/simulador/mojibake-lab', '#/simulador/deutsch-game', '#/leccion/texto-ascii-unicode'];
    const frame = document.getElementById('frame');
    const out = document.getElementById('out');
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    let failed = 0;
    // Un elemento dentro de un contenedor con desplazamiento horizontal propio no ensancha la página.
    const insideScroller = (el) => {
      for (let p = el.parentElement; p && p !== frame.contentDocument.body; p = p.parentElement) {
        const ox = frame.contentWindow.getComputedStyle(p).overflowX;
        if (ox === 'auto' || ox === 'scroll' || ox === 'hidden') return true;
      }
      return false;
    };
    for (const route of routes) {
      if (!frame.src) {
        frame.src = `../index.html${route}`;
        await new Promise((r) => { frame.onload = r; });
      } else {
        frame.contentWindow.location.hash = route;
      }
      await wait(1500);
      const doc = frame.contentDocument;
      const width = doc.documentElement.clientWidth;
      let offenders = [...doc.querySelectorAll('body *')]
        .filter((el) => el.getBoundingClientRect().right > width + 1 && !el.closest('.sidebar, .search-results, .katex-mathml') && !insideScroller(el))
        .slice(0, 3)
        .map((el) => `${el.tagName.toLowerCase()}.${[...el.classList].join('.')} (${Math.round(el.getBoundingClientRect().right)}px)`);
      // Texto residual de valores nulos (p. ej., Element.append(null) escribe «null»)
      const walker = doc.createTreeWalker(doc.querySelector('main'), NodeFilter.SHOW_TEXT);
      const stray = [];
      for (let n = walker.nextNode(); n; n = walker.nextNode()) if (/^\s*(null|undefined|\[object Object\])\s*$/.test(n.textContent)) stray.push(n.textContent.trim());
      if (stray.length) offenders.push(`texto residual: ${stray.join(', ')}`);
      const overflow = doc.documentElement.scrollWidth > width;
      const ok = !overflow && offenders.length === 0;
      if (!ok) failed += 1;
      out.insertAdjacentHTML('beforeend', `<li class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${route} — scrollWidth ${doc.documentElement.scrollWidth} / ${width}${offenders.length ? ` — ${offenders.join(', ')}` : ''}</li>`);
    }
    document.body.dataset.status = failed ? 'fail' : 'pass';
  </script>
</body>
</html>
