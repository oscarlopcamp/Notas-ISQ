<head>

  <meta name="color-scheme" content="light dark">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">

  <link rel="stylesheet" href="src/styles/layout.css">

  <script>
    // Aplica tema y tamaño de letra antes del primer pintado para evitar parpadeos.
    try {
      var s = JSON.parse(localStorage.getItem('isq.v1') || '{}');
      if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
      if (s.fontScale) document.documentElement.style.setProperty('--font-scale', s.fontScale);
    } catch (e) {}
  </script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script type="module" src="src/scripts/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-skip>Saltar al contenido</a>

  <header class="topbar">
    <button class="icon-btn menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir índice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">|ψ⟩</span>
      <span class="brand-text">Ingeniería de Software Cuántico<small>Libro interactivo</small></span>

    <div class="search" role="search">

    </div>

      <button class="icon-btn" type="button" data-font="-1" aria-label="Reducir tamaño de letra">A−</button>
      <button class="icon-btn" type="button" data-font="1" aria-label="Aumentar tamaño de letra">A+</button>
      <button class="icon-btn theme-toggle" type="button" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">

    <div class="sidebar-backdrop" hidden></div>
    <main id="main" class="main" tabindex="-1">
      <noscript><p class="page">Esta plataforma necesita JavaScript para funcionar.</p></noscript>
      <p class="page loading">Cargando…</p>
    </main>
